<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brilho Auto Spa - Serviços</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img
      src="https://api.iconify.design/mdi/car-wash.svg?color=gold"
      alt="Logo de lava car"
      width="100"
    >
    <h1>Brilho Auto Spa</h1>
    <p>Serviços disponíveis para o seu carro.</p>
  </header>

  <nav aria-label="Navegação principal">
    <a href="index.html">Início</a>
    <a href="servicos.html" aria-current="page">Serviços</a>
    <a href="contato.html">Contato</a>
  </nav>

  <main>
    <section>
      <h2>Serviços disponíveis</h2>
      <p>Escolha uma das opções abaixo para cuidar do seu veículo.</p>

      <label for="filtroCategoria">Filtrar serviços por categoria:</label>
      <select id="filtroCategoria">
        <option value="todos">Todos os serviços</option>
        <option value="lavagem">Lavagem</option>
        <option value="higienizacao">Higienização</option>
        <option value="protecao">Proteção da pintura</option>
      </select>
      <p id="mensagemFiltro" aria-live="polite">Mostrando todos os serviços.</p>
      <div id="listaServicos" class="lista-servicos"></div>
    </section>

    <section class="preferencia">
      <h2>Meu serviço favorito</h2>
      <label for="servicoFavorito">Escolha um serviço:</label>
      <select id="servicoFavorito">
        <option value="">Selecione...</option>
        <option value="lavagem-simples">Lavagem simples</option>
        <option value="lavagem-completa">Lavagem completa</option>
        <option value="higienizacao-interna">Higienização interna</option>
        <option value="higienizacao-bancos">Higienização de bancos</option>
        <option value="enceramento">Enceramento</option>
      </select>
      <button id="btnSalvarFavorito" type="button">Salvar favorito</button>
      <p id="favoritoSalvo" aria-live="polite"></p>
    </section>

    <section class="consulta-servico">
      <h2>Consulte um serviço</h2>
      <label for="servico">Escolha um serviço:</label>
      <select id="servico">
        <option value="">Selecione...</option>
        <option value="lavagem-simples">Lavagem simples</option>
        <option value="lavagem-completa">Lavagem completa</option>
        <option value="enceramento">Enceramento</option>
      </select>
      <button id="btnConsultar" type="button">Consultar orientação</button>
      <p id="resultado" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <p>Projeto acadêmico - Programação Web</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
